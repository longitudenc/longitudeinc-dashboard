# .github/workflows/scrape.yml
#
# Nightly SD3 scrape orchestrator.
#
# The SCHEDULE ITSELF IS NOT IN THIS FILE. It lives in lib/scrape-plan.ts and is
# served by /api/cron/plan; this workflow asks for today's job list and runs it.
# So adding a nightly data point is a one-line change in that file and this
# workflow never needs editing.
#
# Each job is its own HTTP request, so each gets a fresh 60s Vercel budget. A
# GitHub Actions job can run for ~hours, so total wall time doesn't matter.
#
# Setup (one time):
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     CRON_SECRET        = the CRON_SECRET from Vercel's env
#     CRON_HEARTBEAT_URL = (optional but recommended) Healthchecks.io ping URL
#
# HOW YOU FIND OUT SOMETHING BROKE:
#   a job errors        -> the run goes red and GitHub emails you.
#   the run never fires -> the heartbeat below is never pinged, and
#                          Healthchecks.io emails you. This is the case a red-run
#                          email cannot cover, because there is no run to be red.
#
#   Note: lib/alert.ts / ALERT_EMAIL is a SEPARATE path used only by
#   /api/cron/weekly and /api/report/payroll-pace. The /api/scrape/* routes do
#   not call it, so the red run above is what covers them.

name: SD3 Nightly Scrape

on:
  schedule:
    # THREE firings a day, deliberately. GitHub delayed one scheduled run by 11
    # hours and dropped the next one entirely, which lost a day of data. Every
    # run re-pulls the last 7 days, so a later firing repairs whatever an
    # earlier one missed, and the scrapes are idempotent upserts.
    - cron: '0 8 * * *'      # 08:00 UTC (~4 AM ET) - primary
    - cron: '0 15 * * *'     # 15:00 UTC (~11 AM ET) - catch-up
    - cron: '0 22 * * *'     # 22:00 UTC (~6 PM ET) - catch-up
  workflow_dispatch:
    inputs:
      date:
        description: 'Plan as if it were this date (YYYY-MM-DD, UTC). Blank = today.'
        required: false

concurrency:                  # never let two runs overlap
  group: sd3-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://longitudeinc-dashboard.vercel.app
      SECRET: ${{ secrets.CRON_SECRET }}
      HEARTBEAT: ${{ secrets.CRON_HEARTBEAT_URL }}
      PLAN_DATE: ${{ inputs.date }}
    steps:
      - name: Fetch today's plan
        run: |
          set -uo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "::error title=missing secret::CRON_SECRET is not set on this repo"
            exit 1
          fi
          # hour lets the plan keep once-a-day jobs (the payroll-pace email)
          # to the first run, now that the schedule fires more than once.
          url="$BASE/api/cron/plan?secret=$SECRET&hour=$(date -u +%H)"
          if [ -n "${PLAN_DATE:-}" ]; then url="$url&date=$PLAN_DATE"; fi
          code=$(curl -s -o plan.json -w '%{http_code}' --max-time 60 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error title=plan fetch failed::HTTP $code"
            head -c 400 plan.json 2>/dev/null; echo
            exit 1
          fi
          jq -r '"Plan for \(.date): \(.count) jobs"' plan.json
          jq -r '.jobs[] | "  - \(.name) \(.query)"' plan.json
          # Tab-separated so the runner loop never has to parse JSON per job.
          jq -r '.jobs[] | [.name, .path, .query] | @tsv' plan.json > jobs.tsv

      - name: Run the plan
        run: |
          set -uo pipefail
          FAIL=0
          while IFS=$'\t' read -r name path query; do
            [ -z "${name:-}" ] && continue
            echo "::group::$name"
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 120 \
                   "$BASE${path}?secret=$SECRET${query:-}" || echo 000)
            echo "HTTP $code"
            head -c 600 out.json; echo
            # An endpoint can answer 200 and still report trouble in the body.
            if [ "$code" != "200" ] || grep -q '"ok":false' out.json; then
              echo "::error title=$name failed::HTTP $code"
              FAIL=1
            fi
            echo "::endgroup::"
          done < jobs.tsv

          # Dead-man's switch: pinged ONLY on a fully clean run, so a partial
          # failure surfaces as a missed check as well as a red run.
          if [ "$FAIL" = "0" ] && [ -n "${HEARTBEAT:-}" ]; then
            curl -s -m 10 "$HEARTBEAT" > /dev/null || true
          else
            if [ -z "${HEARTBEAT:-}" ]; then
              echo "::warning title=no heartbeat::CRON_HEARTBEAT_URL is not set, so a run that never fires will go unnoticed"
            fi
          fi
          exit $FAIL
